name: AccountingQuestionStudio

options:
  bundleIdPrefix: com.accountingquestionsuite
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  AccountingQuestionKit:
    path: ../Shared/AccountingQuestionKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  AccountingQuestionStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../Samples/ALL_FORMATS_SAMPLE.md
        buildPhase: resources
      - path: ../Samples/SPREADSHEET_PRACTICE.md
        buildPhase: resources
    dependencies:
      - package: AccountingQuestionKit
    info:
      path: Sources/AccountingQuestionStudio/Info.plist
      properties:
        CFBundleDisplayName: Statement Studio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.education
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
              public.mime-type:
                - text/markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.accountingquestionsuite.mac
        PRODUCT_NAME: Statement Studio
        PRODUCT_MODULE_NAME: AccountingQuestionStudio
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/AccountingQuestionStudio/StatementStudio.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: true
        ENABLE_USER_SELECTED_FILES: readonly

  AccountingQuestionStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AccountingQuestionStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.accountingquestionsuite.mac.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Statement Studio.app/Contents/MacOS/Statement Studio"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AccountingQuestionStudio:
    build:
      targets:
        AccountingQuestionStudio: all
        AccountingQuestionStudioTests: [test]
    test:
      targets:
        - AccountingQuestionStudioTests
    run:
      config: Debug
    archive:
      config: Release
