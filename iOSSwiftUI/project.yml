name: AccountingQuestionSuite

options:
  bundleIdPrefix: com.accountingquestionsuite
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  AccountingQuestionKit:
    path: ../Shared/AccountingQuestionKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES

targets:
  AccountingQuestionSuite:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
      - path: ../Samples/ALL_FORMATS_SAMPLE.md
        buildPhase: resources
      - path: ../Samples/SPREADSHEET_PRACTICE.md
        buildPhase: resources
    dependencies:
      - package: AccountingQuestionKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Ledger Pocket
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.education
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
              public.mime-type:
                - text/markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.accountingquestionsuite.ledgerpocket
        PRODUCT_NAME: Ledger Pocket
        PRODUCT_MODULE_NAME: AccountingQuestionSuite
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  AccountingQuestionSuiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AccountingQuestionSuite
      - package: AccountingQuestionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.accountingquestionsuite.ledgerpocket.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ledger Pocket.app/Ledger Pocket"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AccountingQuestionSuite:
    build:
      targets:
        AccountingQuestionSuite: all
        AccountingQuestionSuiteTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: AccountingQuestionSuiteTests
