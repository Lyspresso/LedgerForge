[package]
name = "accounting-question-studio"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
description = "A native macOS study app for composable intermediate-accounting questions"
license = "MIT"

[lib]
name = "accounting_question_core"
path = "src/lib.rs"

[[bin]]
name = "accounting-question-studio"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.35.0", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow"] }
rfd = { version = "0.15.4", optional = true, default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSButton", "NSControl", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSObject", "objc2-core-foundation"] }
raw-window-handle = "0.6.2"

[dev-dependencies]
